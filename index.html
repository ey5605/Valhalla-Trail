<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.json"><title>Valhalla Trail</title><style>
html,body{margin:0;height:100%;background:#111827;color:#fff;font-family:system-ui,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}section{max-width:440px}h1{font-size:30px}p{line-height:1.7}button{font:inherit;font-weight:700;padding:14px 20px;margin:6px;border:0;border-radius:12px;cursor:pointer}#retry{background:#b8ef9e}iframe{border:0;position:fixed;inset:0;width:100%;height:100%;background:#111827}[hidden]{display:none!important}</style></head><body><main id="loading"><section><h1>Valhalla Trail</h1><p id="status" role="status">בודק אם יש עדכון… / Checking for updates…</p><div id="actions" hidden><button id="retry">לנסות שוב / Retry</button><button id="offline" hidden>לשחק בגרסה השמורה / Play saved version</button></div></section></main><script>
const CACHE='valhalla-game-verified-v1',base=new URL('./',location.href).href,key=base+'saved-game',statusEl=document.getElementById('status'),actions=document.getElementById('actions'),offline=document.getElementById('offline');
let saved=null,busy=false;
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
async function readSaved(){try{const c=await caches.open(CACHE);const r=await c.match(key);return r?{html:await r.text(),version:r.headers.get('X-Game-Version')}:null;}catch(_){return null;}}
async function network(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}}
async function hash(text){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');}
function play(html){const frame=document.createElement('iframe');frame.title='Valhalla Trail';frame.allow='autoplay; fullscreen';frame.setAttribute('allowfullscreen','');frame.srcdoc=html.replace('<head>','<head><base href="'+base+'">');document.body.appendChild(frame);document.getElementById('loading').hidden=true;}
async function launch(){if(busy)return;busy=true;actions.hidden=true;statusEl.textContent='בודק אם יש עדכון… / Checking for updates…';try{
 saved=await readSaved();
 const meta=JSON.parse(await network(base+'version.json?check='+Date.now(),5000));if(!/^[a-f0-9]{64}$/.test(meta.version))throw Error('Invalid version');
 if(saved&&saved.version===meta.version){play(saved.html);return;}
 statusEl.textContent='מעדכן את המשחק… / Updating the game…';
 const html=await network(base+'game.html?v='+meta.version,20000);if(await hash(html)!==meta.version)throw Error('Publication in progress');
 try{const c=await caches.open(CACHE);await c.put(key,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8','X-Game-Version':meta.version}}));}catch(_){}
 play(html);
 }catch(_){statusEl.textContent='לא הצלחנו לבדוק או להוריד את העדכון. אפשר לנסות שוב'+(saved?' או לשחק בגרסה השמורה, שעשויה להיות ישנה.':'. לפתיחה הראשונה דרוש חיבור לאינטרנט.')+' / Update unavailable. Retry'+(saved?' or play the saved version.':'; internet required for first launch.');offline.hidden=!saved;actions.hidden=false;}finally{busy=false;}}
document.getElementById('retry').onclick=launch;offline.onclick=()=>{if(saved&&!busy)play(saved.html);};launch();
</script></body></html>
